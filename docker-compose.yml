name: ink-batch-press-release
services:
  backend:
    build: ./backend
    environment:
      DATABASE_URL: sqlite:////data/ink.db
    volumes:
      - ink_data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 5s
      timeout: 3s
      retries: 10
  web:
    build: ./frontend
    ports:
      - "${WEB_PORT:-3005}:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/health"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  ink_data:
